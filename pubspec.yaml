name: driving_exam
description: "German Driving Theory Exam Trainer (Klasse B) — Bilingual DE/EN."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  fvp: ^0.40.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/driving_theory_questions_b.json
    - assets/driving_theory_questions_de_b.json
    - assets/images/
    - assets/videos/
