  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2563EB;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #2563EB;
      z-index: 9999;

      background: rgba(255, 255, 255, 0.16);

  <div id="app-splash" aria-hidden="true">
